[project]
name = "flashcard-backend"
version = "0.1.0"
description = "Backend API for personal flashcard app using Anki's FSRS engine"
requires-python = ">=3.11"
dependencies = [
    "anki==26.9.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "edge-tts>=7.0.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
